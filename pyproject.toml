[project]
name = "localvorcans"
version = "0.1.0"
description = "Batch Bayesian optimization with Voronoi-boundary candidates and local approximate GPs in JAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.12.0.1",
    "jaxtyping>=0.3.11",
    "jaxvlse>=0.1.3",
    "lagpax",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
tests = [
    "pytest>=9.2.0",
]
gpu = [
    "jax[cuda12]>=0.12.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localvorcans"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.workspace]
members = [
    "vendor/lagpax",
]

[tool.uv.sources]
lagpax = { workspace = true, editable = true }
